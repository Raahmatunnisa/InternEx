services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    image: internex-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - internex_storage:/var/www/html/storage
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: web
    image: internex-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - internex_storage:/var/www/html/storage:ro
    networks:
      - internal
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: internex-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - internex_mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  internex_storage:
  internex_mysql_data:

networks:
  internal:
