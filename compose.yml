services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internex-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: magangtrack
      DB_USERNAME: magangtrack
      DB_PASSWORD: magangtrack

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: internex-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: magangtrack
      MYSQL_USER: magangtrack
      MYSQL_PASSWORD: magangtrack
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - internex_mysql_data:/var/lib/mysql

volumes:
  internex_mysql_data: